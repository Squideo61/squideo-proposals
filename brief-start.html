<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/squideo-favicon.png" />
    <title>Build your video brief — Squideo</title>
    <!-- Embedded in a marketing page that owns the SEO for this. Indexing the
         bare form as well would compete with the page it sits inside. -->
    <meta name="robots" content="noindex,follow" />
    <style>
      html, body { margin: 0; padding: 0; background: transparent; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #brief-start-root { padding: 4px; box-sizing: border-box; }

      /*
       * ?theme=dark — the three things the component's inline styles cannot set.
       *
       * A pseudo-element, a form-control accent and a colour scheme are not
       * properties an element can carry in a style attribute, so no amount of
       * style={{}} reaches them. Left alone on a translucent input the
       * placeholder stays the browser's default dark grey on a near-navy field,
       * the checkbox stays OS blue beside a cyan button, and an autofilled name
       * turns the field solid yellow-white. All three look like bugs.
       *
       * ⚠ `color-scheme` IS ON THE CONTROLS, NOT ON `html`, AND THAT IS THE
       * WHOLE POINT. It was on the root first, and it silently undid the thing
       * this theme exists to do: the canvas takes its colour from the root
       * element's background, and when that background is transparent the
       * browser substitutes the colour scheme's default — which under `dark` is
       * near-black. The frame stopped being see-through and painted a black
       * rectangle over the navy band, so the fix for "can the grey box be
       * transparent" shipped a black box instead. Scoped to the inputs, the
       * autofill and control theming are identical and the canvas stays
       * transparent.
       */
      html[data-theme="dark"] input,
      html[data-theme="dark"] textarea,
      html[data-theme="dark"] select { color-scheme: dark; }
      html[data-theme="dark"] input::placeholder { color: #8FA9BA; opacity: 1; }
      html[data-theme="dark"] input[type="checkbox"] { accent-color: #2BB8E6; }
    </style>
  </head>
  <body>
    <!-- Real markup, not a blank div: this is embedded on a public page, so a
         crawler or a visitor with JS off gets the offer and a way through
         rather than an empty frame. Cleared by briefStart.jsx before mount. -->
    <div id="brief-start-root">
      <noscript>
        <h2>Build your video brief</h2>
        <p>
          A guided tool that turns a rough idea into a document any production
          company could work from. It saves as you type, so you can stop halfway
          and come back.
        </p>
        <p><a href="/portal" target="_top">Open the Squideo portal to start</a></p>
      </noscript>
    </div>
    <script type="module" src="/src/briefStart.jsx"></script>
  </body>
</html>
