<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/squideo-favicon.png" />
    <title>Build your video brief — Squideo</title>
    <!-- Embedded in a marketing page that owns the SEO for this. Indexing the
         bare form as well would compete with the page it sits inside. -->
    <meta name="robots" content="noindex,follow" />
    <style>
      html, body { margin: 0; padding: 0; background: transparent; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #brief-start-root { padding: 4px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <!-- Real markup, not a blank div: this is embedded on a public page, so a
         crawler or a visitor with JS off gets the offer and a way through
         rather than an empty frame. Cleared by briefStart.jsx before mount. -->
    <div id="brief-start-root">
      <noscript>
        <h2>Build your video brief</h2>
        <p>
          A guided tool that turns a rough idea into a document any production
          company could work from. It saves as you type, so you can stop halfway
          and come back.
        </p>
        <p><a href="/portal" target="_top">Open the Squideo portal to start</a></p>
      </noscript>
    </div>
    <script type="module" src="/src/briefStart.jsx"></script>
  </body>
</html>
