<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/squideo-favicon.png" />
    <title>Build your video brief — Squideo</title>
    <!-- Embedded in a marketing page that owns the SEO for this. Indexing the
         bare form as well would compete with the page it sits inside. -->
    <meta name="robots" content="noindex,follow" />
    <style>
      html, body { margin: 0; padding: 0; background: transparent; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #brief-start-root { padding: 4px; box-sizing: border-box; }

      /*
       * ?theme=dark — the two things the component's inline styles cannot set.
       *
       * A pseudo-element and a form-control accent are not properties of an
       * element, so no amount of style={{}} reaches them. Left alone on a
       * translucent input, the placeholder stays the browser's default dark grey
       * on a near-navy field (unreadable) and the checkbox stays the OS blue
       * against a cyan button. Both look like bugs rather than like a theme.
       *
       * `color-scheme` is the load-bearing one: it tells the browser this
       * document is dark, which is what stops Chrome and Safari painting their
       * own light backgrounds into autofilled inputs — the failure that turns a
       * carefully translucent field solid yellow-white the moment somebody's
       * browser fills their name in.
       */
      html[data-theme="dark"] { color-scheme: dark; }
      html[data-theme="dark"] input::placeholder { color: #8FA9BA; opacity: 1; }
      html[data-theme="dark"] input[type="checkbox"] { accent-color: #2BB8E6; }
    </style>
  </head>
  <body>
    <!-- Real markup, not a blank div: this is embedded on a public page, so a
         crawler or a visitor with JS off gets the offer and a way through
         rather than an empty frame. Cleared by briefStart.jsx before mount. -->
    <div id="brief-start-root">
      <noscript>
        <h2>Build your video brief</h2>
        <p>
          A guided tool that turns a rough idea into a document any production
          company could work from. It saves as you type, so you can stop halfway
          and come back.
        </p>
        <p><a href="/portal" target="_top">Open the Squideo portal to start</a></p>
      </noscript>
    </div>
    <script type="module" src="/src/briefStart.jsx"></script>
  </body>
</html>
